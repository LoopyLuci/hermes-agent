[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-bridges"
version = "0.1.0"
description = "Cross-language bridges and self-improvement scaffolding for Hermes expansion."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"hermes_bridges" = ["py.typed"]

name: x-runtime Kotlin verification

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: 'OS matrix to run'
        required: true
        default: '["ubuntu-latest","windows-latest"]'
        type: string
  pull_request:
    paths:
      - 'x-runtime/kotlin/**'
      - 'x-runtime/rust/abi/**'
      - 'x-runtime/protocol/**'
      - 'tests/x-runtime/**'
  push:
    branches: [main]
    paths:
      - 'x-runtime/kotlin/**'
      - 'x-runtime/rust/abi/**'
      - 'x-runtime/protocol/**'
      - 'tests/x-runtime/**'

jobs:
  kotlin-verify:
    name: Kotlin x-runtime verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364b9a25a0 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195ef3f92b50899d61c1d02e26ea2dc7f78418 # v4.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@604d9d4e2b8f3b9b0e2d0489c3f8f3a0d7e6b8c1 # v4.3.0
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6d4f09838e033c0f26b32f3c953b65a10c1f7a1c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@0b93645e5fe2bc2b9c25d581911cdd5f54c79de3 # v5.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@1ec69e07b4f47b39cb035d59d63cb6137110ac98 # v3.0.0
        with:
          version: '0.5.x'

      - name: Cache Kotlin compiler
        uses: actions/cache@v4
        with:
          path: x-runtime/kotlin/dist
          key: kotlin-2.4.10-${{ runner.os }}
          restore-keys: |
            kotlin-2.4.10-${{ runner.os }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            x-runtime/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('x-runtime/rust/Cargo.toml', 'x-runtime/rust/supervisor/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install Kotlin compiler
        if: steps.cache-kotlin.outputs.cache-hit != 'true'
        run: |-
          mkdir -p x-runtime/kotlin/dist
          curl -sSL -o x-runtime/kotlin/dist/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.10/kotlin-compiler-2.4.10.zip
          unzip -q x-runtime/kotlin/dist/kotlinc.zip -d x-runtime/kotlin/dist
          rm x-runtime/kotlin/dist/kotlinc.zip
          echo "KOTLIN_HOME=$(pwd)/x-runtime/kotlin/dist/kotlinc" >> "$GITHUB_ENV"
          echo "$(pwd)/x-runtime/kotlin/dist/kotlinc/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install Python dependencies
        run: |-
          python -m pip install --upgrade pip
          pip install pytest
        shell: bash

      - name: Build Rust ABI
        run: |-
          cd x-runtime/rust
          cargo build --release -p hermes-runtime-abi
        shell: bash

      - name: Build supervisor lib
        run: |-
          cd x-runtime/rust
          cargo test -p hermes-runtime-supervisor --lib
        shell: bash

      - name: Run Python x-runtime tests
        run: |-
          cd x-runtime/rust
          cargo build --release -p hermes-runtime-abi
          cd ../..
          pytest tests/x-runtime -q
        shell: bash

      - name: Run TypeScript tests
        run: |-
          cd x-runtime/typescript
          npx vitest run
        shell: bash

      - name: Run Kotlin tests
        run: |-
          cd x-runtime/kotlin
          chmod +x scripts/build.sh
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell scripts/build.ps1 test
          else
            bash scripts/build.sh test
          fi
        shell: bash
